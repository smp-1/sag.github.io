version: '3.8'

services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://elect27:password@db:5432/elect27
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=super-secret-key-change-in-production
      - FLASK_ENV=development
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    networks:
      - elect27-network

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - elect27-network

  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=elect27
      - POSTGRES_USER=elect27
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seeds:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - elect27-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - elect27-network

volumes:
  postgres_data:

networks:
  elect27-network:
    driver: bridge
